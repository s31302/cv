name: Build LaTeX CV
on: [push]

permissions:
  contents: write # To jest ważne, żeby akcja mogła stworzyć Release

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}